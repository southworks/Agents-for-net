name: Scheduled Teams API Drift Detector

# Periodically compares the declared Microsoft.Teams.Apps baseline with the latest stable release.
# An agent reviews every API change against source and publishes validated implementation impact.
on:
  schedule:
    # Runs at 08:00 UTC every Monday (~1am PST)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Required when Copilot CLI authenticates with the workflow-scoped token.
  copilot-requests: write

concurrency:
  group: teams-api-drift-scheduled
  cancel-in-progress: false

jobs:
  detect-and-report:
    name: Detect and report Microsoft.Teams.Apps drift
    runs-on: ubuntu-latest
    env:
      ARTIFACTS: artifacts/teams-api-drift
      TOOL: scripts/TeamsApiDrift/Microsoft.Agents.TeamsApiDrift.csproj
      TESTS: src/tests/Microsoft.Agents.Extensions.MSTeams.Tests/Microsoft.Agents.Extensions.MSTeams.Tests.csproj
      MANIFEST: scripts/TeamsApiDrift/teams-api-usage.json
      CAPABILITIES: scripts/TeamsApiDrift/teams-capabilities.json
      REVIEW_WORKSPACE: ${{ runner.temp }}/teams-impact-review
      CAN_REVIEW: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning needs repository history to calculate the
          # extension and its project-reference versions.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build drift tool
        id: tool
        continue-on-error: true
        run: dotnet build "$TOOL" -c Release

      - name: Resolve declared baseline version
        id: resolve-baseline-version
        if: always() && steps.tool.outcome == 'success'
        run: |
          version=$(dotnet run --project "$TOOL" -c Release --no-build -- resolve-version --props Directory.Packages.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare with latest listed stable release
        id: compare
        if: always() && steps.resolve-baseline-version.outcome == 'success'
        continue-on-error: true
        run: |
          candidate=$(dotnet run --project "$TOOL" -c Release --no-build -- compare --from "${{ steps.resolve-baseline-version.outputs.version }}" --output "$ARTIFACTS")
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Build MSTeams against candidate
        id: build
        if: always() && steps.compare.outcome == 'success'
        continue-on-error: true
        run: dotnet build src/libraries/Extensions/Microsoft.Agents.Extensions.MSTeams/Microsoft.Agents.Extensions.MSTeams.csproj -c Release -p:Microsoft_Teams_Apps_PkgVer="${{ steps.compare.outputs.candidate }}"

      - name: Run drift tool tests
        id: drift_tests
        if: always()
        continue-on-error: true
        run: dotnet test src/tests/Microsoft.Agents.TeamsApiDrift.Tests/Microsoft.Agents.TeamsApiDrift.Tests.csproj -c Release

      - name: Run candidate contract and boundary tests
        id: candidate_tests
        if: always() && steps.compare.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          for tfm in net8.0 net10.0; do
            dotnet test "$TESTS" -c Release -f "$tfm" -p:Microsoft_Teams_Apps_PkgVer="${{ steps.compare.outputs.candidate }}" --filter 'Category=TeamsApiContract|Category=TeamsApiBoundary'
          done

      - name: Collect usage
        id: collect
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: >-
          dotnet run --project "$TOOL" -c Release --no-build -- collect-usage
          --assembly bin/Release/CplTeams/net8.0/Microsoft.Agents.Extensions.MSTeams.dll
          --assembly bin/Release/CplTeams/net10.0/Microsoft.Agents.Extensions.MSTeams.dll
          --output "$ARTIFACTS/collected-usage.json"

      - name: Validate baseline manifest
        id: manifest
        if: always() && steps.collect.outcome == 'success' && steps.compare.outcome == 'success'
        continue-on-error: true
        run: >-
          dotnet run --project "$TOOL" -c Release --no-build -- validate-usage
          --manifest "$MANIFEST" --collected "$ARTIFACTS/collected-usage.json"
          --api-model "$ARTIFACTS/microsoft-teams-apps-before.api.json"
          --repository-root "$GITHUB_WORKSPACE" --output "$ARTIFACTS/usage-validation.json"

      - name: Write independent check outcomes
        id: checks
        if: always() && steps.tool.outcome == 'success'
        run: >-
          dotnet run --project "$TOOL" -c Release --no-build -- write-test-summary
          --output "$ARTIFACTS/test-summary.json"
          --check tool=${{ steps.tool.outcome }}
          --check compare=${{ steps.compare.outcome }}
          --check build=${{ steps.build.outcome }}
          --check drift-tests=${{ steps.drift_tests.outcome }}
          --check collect=${{ steps.collect.outcome }}
          --check manifest=${{ steps.manifest.outcome }}
          --check candidate-tests=${{ steps.candidate_tests.outcome }}

      - name: Prepare repository snapshot and complete API review
        id: prepare-review
        if: always() && steps.compare.outcome == 'success' && steps.checks.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          options=()
          if [[ "$CAN_REVIEW" != true ]]; then options+=(--defer); fi
          count=$(dotnet run --project "$TOOL" -c Release --no-build -- prepare-impact-review --comparison "$ARTIFACTS/raw-api-diff.json" --before-api "$ARTIFACTS/microsoft-teams-apps-before.api.json" --after-api "$ARTIFACTS/microsoft-teams-apps-after.api.json" --manifest "$MANIFEST" --capabilities "$CAPABILITIES" --collected "$ARTIFACTS/collected-usage.json" --test-summary "$ARTIFACTS/test-summary.json" --repository-root "$GITHUB_WORKSPACE" --workspace "$REVIEW_WORKSPACE" --output "$ARTIFACTS/review-input.json" --empty-review "$ARTIFACTS/impact-review.raw.json" "${options[@]}")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Set up Node for implementation reviewer
        if: steps.prepare-review.outcome == 'success' && steps.prepare-review.outputs.count != '0' && env.CAN_REVIEW == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install review agent
        id: install-agent
        if: steps.prepare-review.outcome == 'success' && steps.prepare-review.outputs.count != '0' && env.CAN_REVIEW == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm install --global @github/copilot
          echo 'Summary: Installed Copilot CLI for repository read/search review.'

      - name: Review every API change against the implementation
        id: review
        if: steps.install-agent.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/teams-impact-copilot
        run: bash scripts/TeamsApiDrift/run-impact-review.sh

      - name: Validate decisions, source evidence, and review identity
        id: validate-review
        if: always() && steps.prepare-review.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          status=0
          dotnet run --project "$TOOL" -c Release --no-build -- validate-impact-review --input "$ARTIFACTS/review-input.json" --review "$ARTIFACTS/impact-review.raw.json" --workspace "$REVIEW_WORKSPACE" --repository-root "$GITHUB_WORKSPACE" --output "$ARTIFACTS/impact-review-validation.json" --report "$ARTIFACTS/impact-report.md" || status=$?
          if [[ -f "$ARTIFACTS/impact-report.md" ]]; then cat "$ARTIFACTS/impact-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"

      - name: Upload comparison and implementation review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teams-api-drift-scheduled-${{ github.run_id }}
          path: artifacts/teams-api-drift
          retention-days: 21
          if-no-files-found: warn

      - name: Create or update implementation review issue
        if: always() && steps.prepare-review.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: artifacts/teams-api-drift/impact-report.md
          INPUT_PATH: artifacts/teams-api-drift/review-input.json
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync(process.env.REPORT_PATH)) {
              console.log('Summary: Review report unavailable; see validation logs.');
              return;
            }
            const input = JSON.parse(fs.readFileSync(process.env.INPUT_PATH, 'utf8'));
            if (input.comparison.changes.length === 0) {
              console.log('Summary: No API changes; no implementation review issue needed.');
              return;
            }
            const marker = '<!-- teams-api-drift-scheduled -->';
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const body = `${marker}\n${report.slice(0, 55000)}\n\n[Full report and artifacts](${runUrl})`;
            const title = `Microsoft.Teams.Apps implementation review: ${input.comparison.fromVersion} → ${input.comparison.toVersion}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            const response = existing
              ? await github.rest.issues.update({ owner, repo, issue_number: existing.number, title, body })
              : await github.rest.issues.create({ owner, repo, title, body });
            console.log(`Summary: Published implementation review: ${response.data.html_url}`);

      - name: Report final workflow result
        if: always()
        shell: bash
        run: |
          failures=()
          check() {
            printf '%-30s %s\n' "$1" "$2"
            [[ "$2" == success ]] || failures+=("$1")
          }
          check tool "${{ steps.tool.outcome }}"
          check compare "${{ steps.compare.outcome }}"
          check build "${{ steps.build.outcome }}"
          check drift-tests "${{ steps.drift_tests.outcome }}"
          check collect "${{ steps.collect.outcome }}"
          check manifest "${{ steps.manifest.outcome }}"
          check candidate-tests "${{ steps.candidate_tests.outcome }}"
          check check-summary "${{ steps.checks.outcome }}"
          check baseline "${{ steps.resolve-baseline-version.outcome }}"
          check snapshot "${{ steps.prepare-review.outcome }}"
          check review-validation "${{ steps.validate-review.outcome }}"
          if [[ "${{ steps.prepare-review.outputs.count }}" != 0 && "$CAN_REVIEW" == true ]]; then
            check agent-install "${{ steps.install-agent.outcome }}"
            check implementation-review "${{ steps.review.outcome }}"
          fi
          if [[ -f "$ARTIFACTS/impact-review-validation.json" ]]; then
            jq -r '.summary | "Safe: \(.safe) | Needs adaptation: \(.needsAdaptation) | Needs human review: \(.needsHumanReview)"' "$ARTIFACTS/impact-review-validation.json"
            jq -r '.decisions[] | select(.verdict != "safe") | "\(.changeId): \(.verdict) — \(.reason)"' "$ARTIFACTS/impact-review-validation.json"
            [[ "$(jq -r '.canProceed' "$ARTIFACTS/impact-review-validation.json")" == true ]] || failures+=(impact-policy)
          else
            failures+=(missing-impact-review)
          fi
          if (( ${#failures[@]} )); then printf 'Summary: Workflow FAILED: %s\n' "${failures[*]}"; exit 1; fi
          echo 'Summary: All API changes assessed as safe with validated evidence; independent checks passed.'
